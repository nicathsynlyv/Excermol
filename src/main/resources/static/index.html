<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Excermol CRM</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="/genfavicon-48.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/genfavicon-256.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/genfavicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/genfavicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-57x57.png" sizes="57x57">
  <link rel="apple-touch-icon" href="/apple-touch-icon-114x114.png" sizes="114x114">
  <link rel="apple-touch-icon" href="/apple-touch-icon-120x120.png" sizes="120x120">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 50%, #0f1f3f 100%);
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
    }

    .container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px 16px 100px; /* alt padding status-bar üçün yer saxlayır */
    }

    .orbs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.3;
      animation: float 15s ease-in-out infinite;
    }

    .orb1 {
      width: min(300px, 60vw);
      height: min(300px, 60vw);
      background: rgba(100, 200, 255, 0.5);
      top: -80px;
      left: -80px;
      animation: float 20s ease-in-out infinite;
    }

    .orb2 {
      width: min(200px, 45vw);
      height: min(200px, 45vw);
      background: rgba(200, 100, 255, 0.5);
      bottom: -40px;
      right: -40px;
      animation: float 25s ease-in-out infinite reverse;
    }

    .orb3 {
      width: min(250px, 50vw);
      height: min(250px, 50vw);
      background: rgba(100, 255, 200, 0.5);
      top: 45%;
      right: 5%;
      animation: float 18s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    .logo {
      font-size: clamp(28px, 7vw, 48px);
      font-weight: bold;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #64c8ff, #c864ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s ease-in-out infinite;
    }

    .subtitle {
      font-size: clamp(14px, 3.5vw, 22px);
      color: #b0b0c0;
      margin-bottom: 28px;
      padding: 0 8px;
    }

    /* ✅ LIVE STATUS ROW */
    .live-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      color: #c9c9e0;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }

    .pill .dot.ok { background: #4ade80; animation: pulse 2s infinite; }
    .pill .dot.fail { background: #f87171; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      width: 100%;
      margin: 0 0 32px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px 12px;
      backdrop-filter: blur(10px);
    }

    .card-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-text {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:active { transform: scale(0.97); }

    .button.primary {
      background: linear-gradient(135deg, #64c8ff, #c864ff);
      color: #0f0f1e;
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .button.secondary:hover { background: rgba(255, 255, 255, 0.12); }

    /* ✅ STATUS BAR */
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 30, 0.85);
      border-top: 1px solid rgba(100, 200, 255, 0.25);
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 11px;
      color: #64c8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .status-bar span { white-space: nowrap; }

    .pulse {
      width: 8px;
      height: 8px;
      background: #64c8ff;
      border-radius: 50%;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    #clock {
      font-family: monospace;
      color: #fff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(100, 200, 255, 0.5); }
      50% { text-shadow: 0 0 40px rgba(200, 100, 255, 0.8); }
    }

    /* ✅ Kiçik telefonlar üçün əlavə sıxlaşdırma */
    @media (max-width: 380px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .status-bar { font-size: 10px; gap: 6px 10px; }
      .button { padding: 11px 20px; font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .pulse, .dot.ok, .logo { animation: none; }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="content">
    <div class="logo">✨ EXCERMOL</div>
    <div class="subtitle">Customer Relationship Management</div>

    <div class="live-row">
      <div class="pill"><span class="dot ok"></span><span>Backend API Ready</span></div>
      <div class="pill"><span class="dot ok"></span><span id="versionText">Spring Boot</span></div>
      <div class="pill"><span class="dot ok"></span><span id="uptimeText">Uptime: —</span></div>
    </div>

    <div class="cards-grid">
      <div class="card">
        <div class="card-icon">👥</div>
        <div class="card-title">Contacts</div>
        <div class="card-text">Manage customers</div>
      </div>

      <div class="card">
        <div class="card-icon">🏢</div>
        <div class="card-title">Companies</div>
        <div class="card-text">Track deals</div>
      </div>

      <div class="card">
        <div class="card-icon">📊</div>
        <div class="card-title">Campaigns</div>
        <div class="card-text">Marketing</div>
      </div>

      <div class="card">
        <div class="card-icon">📈</div>
        <div class="card-title">Analytics</div>
        <div class="card-text">Insights</div>
      </div>
    </div>

    <div class="actions">
      <!--      <a class="button primary" href="/swagger-ui/index.html">📖 Swagger UI</a>-->
      <a class="button secondary" href="https://github.com/nicathsynlyv/Excermol" target="_blank" rel="noopener">⭐ GitHub</a>
    </div>
  </div>

  <div class="status-bar">
    <div class="pulse"></div>
    <span>Backend API Ready</span>
    <span id="clock"></span>
  </div>
</div>

<script>
  // Saat
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("clock").innerText = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Uptime hesablama (səhifə açılan andan etibarən — sadə göstərici)
  const startTime = Date.now();
  function updateUptime() {
    const diff = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
    const s = String(diff % 60).padStart(2, '0');
    document.getElementById("uptimeText").innerText = `Session: ${h}:${m}:${s}`;
  }
  setInterval(updateUptime, 1000);
  updateUptime();
</script>

</body>
</html>
